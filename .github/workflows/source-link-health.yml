name: Source Link Health

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:source-links
